[project]
name = "tilusion"
version = "0.1.0"
description = "Local-first novel timeline workbench foundations"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.3.0",
  "lxml>=5.0.0",
  "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tilusion = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
