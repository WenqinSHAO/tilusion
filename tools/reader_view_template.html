<!--
  Template for generate_reader_view.py — self-contained reader-view HTML.
  Contains CSS and JS skeleton; {{PLACEHOLDER}} strings are replaced with
  extracted entity/event/timeline data at generation time.
--><!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reader View — {{UNIT_ID}}</title>
  <style>
    :root {
      --bg: #f5efe1;
      --ink: #15130f;
      --muted: #7a715f;
      --line: rgba(25, 22, 16, 0.14);
      --soft-line: rgba(25, 22, 16, 0.08);
      --paper: rgba(255, 251, 241, 0.88);
      --panel: rgba(255, 248, 232, 0.72);
      --event: #d75533;
      --event-soft: rgba(215, 85, 51, 0.13);
      --entity: #6f4b2a;
      --entity-soft: rgba(111, 75, 42, 0.11);
      --location: #395e4a;
      --location-soft: rgba(57, 94, 74, 0.13);
      --thread: #5f5946;
      --accent: #d75533;
      --accent-soft: rgba(215, 85, 51, 0.16);
      --shadow: 0 16px 42px rgba(38, 31, 23, 0.10);
      --radius: 20px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --conf-high: #2d6a4f;
      --conf-med: #9c6a2f;
      --conf-low: #9a4a3f;
      --graph-lane: rgba(21,19,15,0.18);
      --graph-dot-stroke: rgba(21,19,15,0.40);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 24% 18%, rgba(215, 85, 51, 0.10), transparent 28%),
        radial-gradient(circle at 80% 4%, rgba(57, 94, 74, 0.10), transparent 25%),
        linear-gradient(135deg, #f7f0df 0%, #eee1c5 100%);
      font-family: var(--sans);
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px;
      gap: 10px;
    }

    /* ---- top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 250, 240, 0.76);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(20px, 3vw, 28px);
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    .subtitle {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      margin-left: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spacer { flex: 1; }

    /* ---- workspace ---- */
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(380px, 0.85fr);
      gap: 10px;
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .panel-header {
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .source-panel .panel-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 20px;
    }
    .source-header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .source-header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .eyebrow {
      margin: 0 0 2px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .panel-title h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chapter-placeholder {
      color: var(--muted);
      font-style: italic;
      margin: 0;
      line-height: 1;
    }
    .panel-tools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tool-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.36);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 10px;
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      transition: background 140ms ease;
      white-space: nowrap;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.58); }
    .tool-btn.active { background: var(--ink); color: var(--bg); }

    /* ---- source pane ---- */
    .source-scroll {
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 24px clamp(20px, 3vw, 48px) 120px;
    }

    .source-text {
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.9;
      letter-spacing: 0.01em;
      text-align: justify;
    }
    .source-text p {
      margin: 0 0 1em;
      text-indent: 2em;
    }
    .source-text p:first-child { text-indent: 0; }

    /* marks */
    mark {
      background: transparent;
      color: inherit;
      padding: 1px 2px 2px;
      border-radius: 5px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      cursor: pointer;
      transition: background 140ms ease, box-shadow 140ms ease;
    }
    mark.entity { background: var(--entity-soft); box-shadow: inset 0 -2px rgba(111, 75, 42, 0.22); }
    mark.location { background: var(--location-soft); box-shadow: inset 0 -2px rgba(57, 94, 74, 0.22); }
    mark.time { background: rgba(156, 106, 47, 0.12); box-shadow: inset 0 -2px rgba(156, 106, 47, 0.24); }
    mark.hidden-mark {
      background: transparent !important;
      box-shadow: none !important;
    }
    mark.active-span {
      background: rgba(215, 85, 51, 0.30) !important;
      box-shadow: 0 0 0 4px var(--accent-soft), inset 0 -2px rgba(215, 85, 51, 0.52) !important;
    }

    /* ---- right pane body (sidebar + content) ---- */
    .right-pane-body {
      display: grid;
      grid-template-columns: 180px 1fr;
      min-height: 0;
      overflow: hidden;
    }

    /* ---- vertical sidebar nav ---- */
    .sidebar-nav {
      min-height: 0;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.35);
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

    .nav-section {
      padding: 0;
    }
    .nav-section + .nav-section {
      border-top: 1px solid var(--soft-line);
    }
    .nav-section-header {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 14px 6px;
      position: sticky;
      top: 0;
      background: rgba(255, 250, 240, 0.92);
      backdrop-filter: blur(6px);
      z-index: 2;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 8px 10px;
    }

    .nav-item {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 140ms ease, border-color 140ms ease;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover { background: rgba(255,255,255,0.52); border-color: var(--line); }
    .nav-item.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .nav-item .conf-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .conf-dot.high { background: var(--conf-high); }
    .conf-dot.medium { background: var(--conf-med); }
    .conf-dot.low { background: var(--conf-low); }

    /* ---- right pane content column ---- */
    .right-pane-content {
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- timeline scroll area ---- */
    .timeline-scroll {
      min-height: 0;
      overflow: auto;
      scroll-behavior: smooth;
      cursor: grab;
      background:
        radial-gradient(circle at 8% 4%, rgba(215,85,51,0.06), transparent 18%),
        linear-gradient(180deg, rgba(255,250,240,0.28), rgba(255,250,240,0.04));
    }
    .timeline-scroll.dragging {
      cursor: grabbing;
      user-select: none;
    }

    /* ---- SVG git graph ---- */
    .tl-graph {
      display: block;
      min-width: 1100px;
      min-height: 900px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .timeline-scroll.dragging .tl-graph {
      cursor: grabbing;
    }
    .tl-graph .pan-surface {
      fill: transparent;
      pointer-events: all;
      cursor: grab;
    }
    .timeline-scroll.dragging .pan-surface {
      cursor: grabbing;
    }
    .tl-graph .lane-line {
      stroke: var(--graph-lane);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
    }
    .tl-graph .edge-curve {
      stroke: var(--graph-lane);
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 5 4;
      opacity: 0.8;
    }
    .tl-graph .edge-curve.same-lane {
      stroke: rgba(21,19,15,0.12);
      stroke-dasharray: none;
      stroke-width: 2;
    }
    .tl-graph .cross-lane-connector {
      stroke: rgba(21,19,15,0.13);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 3 4;
    }
    .tl-graph .event-dot {
      cursor: pointer;
      transition: r 140ms ease, filter 140ms ease;
    }
    .tl-graph .event-dot:hover {
      filter: brightness(0.85);
    }
    .tl-graph .event-dot.active-dot {
      filter: brightness(0.8) drop-shadow(0 0 4px var(--accent-soft));
    }
    .tl-graph .event-dot.conf-high { fill: var(--conf-high); stroke: var(--conf-high); }
    .tl-graph .event-dot.conf-medium { fill: var(--conf-med); stroke: var(--conf-med); }
    .tl-graph .event-dot.conf-low { fill: var(--conf-low); stroke: var(--conf-low); }
    .tl-graph .event-dot.conf-unknown { fill: var(--muted); stroke: var(--muted); }
    .tl-graph .time-anchor-label {
      font-family: var(--mono);
      font-size: 11px;
      fill: var(--muted);
      pointer-events: none;
      user-select: none;
    }
    .tl-graph .event-summary-label {
      font-family: var(--serif);
      font-size: 13px;
      fill: var(--ink);
      pointer-events: none;
      user-select: none;
      text-anchor: middle;
    }
    .tl-graph .event-label-box {
      fill: rgba(255, 250, 240, 0.92);
      stroke: rgba(25, 22, 16, 0.16);
      stroke-width: 1;
      cursor: pointer;
      transition: stroke 160ms ease, stroke-width 160ms ease, fill 160ms ease;
    }
    .tl-graph .graph-event-node:hover .event-label-box {
      stroke: rgba(215, 85, 51, 0.48);
      fill: #fffaf0;
    }
    .tl-graph .graph-event-node.selected .event-label-box {
      stroke: var(--accent);
      stroke-width: 2.5;
      fill: rgba(255, 240, 230, 0.95);
    }
    .tl-graph .graph-event-node.selected .event-summary-label {
      fill: var(--accent);
      font-weight: 600;
    }
    .tl-graph .graph-event-node.highlighted .event-label-box {
      fill: rgba(230, 215, 180, 0.88);
      stroke: rgba(180, 160, 110, 0.40);
    }
    .tl-graph .timeline-title {
      font-family: var(--mono);
      font-size: 10px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: font-size 180ms ease, fill 180ms ease, font-weight 180ms ease;
    }
    .tl-graph .timeline-desc {
      font-family: var(--serif);
      font-size: 12px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: font-size 180ms ease, fill 180ms ease;
    }
    .tl-graph .timeline-title.selected {
      font-size: 16px;
      fill: var(--accent);
      font-weight: 700;
    }
    .tl-graph .timeline-desc.selected {
      font-size: 18px;
      fill: var(--ink);
      font-weight: 600;
    }
    .tl-graph .dimmed-dot {
      opacity: 0.18;
      transition: opacity 200ms ease;
    }

    /* ---- thread view ---- */
    .thread-view-header {
      z-index: 5;
      padding: 10px 20px;
      background: linear-gradient(to bottom, rgba(246, 238, 222, 0.98), rgba(246, 238, 222, 0.82));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--soft-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .thread-view-header-info h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: -0.03em;
    }
    .thread-view-header-info .thread-meta {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
    }
    .thread-toggle-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.42);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .thread-toggle-btn:hover {
      background: rgba(255,255,255,0.68);
      border-color: rgba(21,19,15,0.28);
    }
    .thread-toggle-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .thread-card-stack {
      padding: 0 16px 120px;
    }

    .event-card {
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 240, 0.82);
      box-shadow: 0 6px 18px rgba(38, 31, 23, 0.05);
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, opacity 160ms ease;
    }
    .event-card:hover {
      transform: translateX(3px);
      border-color: rgba(215, 85, 51, 0.45);
      background: #fffaf0;
    }
    .event-card.active {
      border-color: rgba(215, 85, 51, 0.65);
      background: #fffaf0;
      box-shadow: 0 8px 24px rgba(215, 85, 51, 0.10);
    }
    .event-card.dimmed { opacity: 0.22; }

    .event-card .ev-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .event-card .ev-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }
    .event-card .ev-summary {
      font-family: var(--serif);
      font-size: 19px;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.42);
      cursor: pointer;
      white-space: nowrap;
      transition: background 140ms ease;
    }
    .tag:hover { background: rgba(255,255,255,0.68); }
    .tag.entity-tag { color: var(--entity); border-color: rgba(111,75,42,0.24); }
    .tag.location-tag { color: var(--location); border-color: rgba(57,94,74,0.24); }
    .tag.thread-tag { color: var(--thread); border-color: rgba(95,89,70,0.24); }
    .tag.conf-tag.high { color: var(--conf-high); border-color: rgba(45,106,79,0.24); }
    .tag.conf-tag.medium { color: var(--conf-med); border-color: rgba(156,106,47,0.24); }
    .tag.conf-tag.low { color: var(--conf-low); border-color: rgba(154,74,63,0.24); }

    .popover {
      position: fixed;
      z-index: 50;
      max-width: 520px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 250, 240, 0.97);
      box-shadow: 0 16px 42px rgba(38, 31, 23, 0.18);
      color: var(--ink);
      pointer-events: none;
      display: none;
      font-size: 14px;
      line-height: 1.55;
    }
    .popover strong {
      display: block;
      font-family: var(--serif);
      font-size: 22px;
      margin-bottom: 4px;
    }
    .popover .muted {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      margin-bottom: 8px;
    }

    /* ---- chat panel ---- */
    .chat-panel {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 250, 240, 0.76);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 44px;
      max-height: 260px;
      transition: min-height 200ms ease, max-height 200ms ease;
    }
    .chat-panel.has-messages {
      min-height: 200px;
    }
    .chat-panel.collapsed {
      min-height: 44px;
      max-height: 44px;
    }
    .chat-panel.collapsed .chat-messages,
    .chat-panel.collapsed .chat-input-area {
      display: none;
    }
    .chat-panel-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      flex-shrink: 0;
    }
    .chat-panel-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chat-panel-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 6px;
      transition: background 140ms ease;
    }
    .chat-panel-toggle:hover {
      background: rgba(0,0,0,0.06);
    }
    .chat-panel.collapsed .chat-panel-toggle {
      font-size: 18px;
    }
    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-message {
      max-width: 80%;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 12px;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.6;
    }
    .chat-message.user {
      align-self: flex-end;
      background: rgba(25, 22, 16, 0.08);
      color: var(--ink);
      border-bottom-right-radius: 4px;
    }
    .chat-message.app {
      align-self: flex-start;
      background: rgba(255, 245, 235, 0.85);
      border: 1px solid rgba(215, 85, 51, 0.15);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }
    .chat-message .ev-cite {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10pt;
      color: var(--accent);
      background: rgba(215, 85, 51, 0.10);
      border-radius: 6px;
      padding: 1px 6px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: background 140ms ease;
    }
    .chat-message .ev-cite:hover {
      background: rgba(215, 85, 51, 0.22);
    }
    .chat-input-area {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      border-top: 1px solid var(--soft-line);
      background: rgba(255, 250, 240, 0.45);
    }
    .chat-input-area input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-family: var(--sans);
      font-size: 11pt;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.55);
      outline: none;
      transition: border-color 140ms ease;
    }
    .chat-input-area button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 16px;
      font-family: var(--sans);
      font-size: 11pt;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      white-space: nowrap;
      transition: background 140ms ease;
    }
    .chat-input-area input:focus {
      border-color: rgba(215, 85, 51, 0.40);
    }
    .chat-input-area input::placeholder {
      color: var(--muted);
      font-style: italic;
    }
    /* ---- responsive ---- */
    @media (max-width: 980px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .topbar { flex-wrap: wrap; }
      .workspace { grid-template-columns: 1fr; min-height: 1000px; }
      .panel { min-height: 500px; }
    }
    @media (max-width: 640px) {
      .app { padding: 8px; }
      .source-scroll { padding-left: 16px; padding-right: 12px; }
      .brand h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Tilusion</h1>
        <span class="subtitle">{{BOOK_TITLE}}</span>
      </div>
      <div class="spacer"></div>
    </header>

    <section class="workspace">
      <section class="panel source-panel">
        <div class="panel-header">
          <div class="source-header-left">
            <div class="panel-title">
              <p class="eyebrow">Source text</p>
            </div>
            <div class="source-header-tools">
              <button class="tool-btn active" data-hl="entity">Entities</button>
              <button class="tool-btn active" data-hl="location">Locations</button>
              <button class="tool-btn active" data-hl="time">Time</button>
              <button class="tool-btn" data-hl="clear">Clear</button>
            </div>
          </div>
          <h2 id="chapterLabel" class="chapter-placeholder">卷一　闺房记乐</h2>
        </div>
        <div class="source-scroll" id="sourceScroll">
          <!-- SOURCE_HTML -->
        </div>
      </section>

      <aside class="panel timeline-panel" id="rightPane">
        <div class="panel-header">
          <div class="panel-title">
            <p class="eyebrow">Structured view</p>
            <h2>{{TIMELINE_COUNT}} timelines · {{THREAD_COUNT}} threads</h2>
          </div>
        </div>
        <div class="right-pane-body">
          <nav class="sidebar-nav" id="sidebarNav">
            <div class="nav-section">
              <div class="nav-section-header">Timelines</div>
              <div class="nav-list" id="timelineNavList">
                <!-- TIMELINE_NAV -->
              </div>
            </div>
            <div class="nav-section">
              <div class="nav-section-header">Threads</div>
              <div class="nav-list" id="threadNavList">
                <!-- THREAD_NAV -->
              </div>
            </div>
          </nav>
          <!-- TIMELINE_HTML -->
        </div>
      </aside>
    </section>

    <footer class="chat-panel" id="chatPanel">
      <div class="chat-panel-bar">
        <span class="chat-panel-title">Ask the book</span>
        <button class="chat-panel-toggle" id="chatPanelToggle" title="Collapse chat">−</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-message app">
          欢迎！你可以用自然语言询问关于《浮生六记》的事件、人物和时间线。<br>
          例如：<i>"记得芸娘和作者父母慢慢闹了矛盾，有张力，主要有哪些线索？"</i>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ask about events, characters, timelines..." />
        <button id="chatSendBtn">Send</button>
      </div>
    </footer>
  </main>
  <div class="popover" id="popover"></div>

  <!-- DATA_SCRIPT -->

  <script>
    // ── Data ──
    const ATOMS = DATA_PLACEHOLDER_ATOMS;
    const ENTITIES = DATA_PLACEHOLDER_ENTITIES;
    const LOCATIONS = DATA_PLACEHOLDER_LOCATIONS;
    const THREADS = DATA_PLACEHOLDER_THREADS;
    const TIMELINES = DATA_PLACEHOLDER_TIMELINES;
    const ATOM_BY_ID = Object.fromEntries(ATOMS.map(a => [a.atom_id, a]));
    const ENTITY_BY_ID = Object.fromEntries(ENTITIES.map(e => [e.entity_id, e]));
    const LOCATION_BY_ID = Object.fromEntries(LOCATIONS.map(l => [l.location_id, l]));
    const THREAD_BY_ID = Object.fromEntries(THREADS.map(t => [t.thread_id, t]));

    // ── DOM refs ──
    const sourceScroll = document.getElementById('sourceScroll');
    const timelineScroll = document.getElementById('timelineScroll');
    const popover = document.getElementById('popover');

    // ── State ──
    let currentView = 'timeline'; // 'timeline' | 'thread'
    let activeThreadId = null;
    let activeTimelineId = null;
    let _graphLayout = null;
    const activeMarkTypes = new Set(['entity', 'location', 'time']);

    sourceScroll.addEventListener('scroll', updateCurrentParagraph);

    // Drag-to-pan the graph canvas. Native wheel/trackpad scrolling still works.
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panScrollLeft = 0;
    let panScrollTop = 0;
    let panMoved = false;
    let suppressGraphClick = false;
    function beginPan(e) {
      if (currentView !== 'timeline') return;
      if (e.button !== 0) return;
      if (e.target.closest && e.target.closest('.graph-event-node')) return;
      e.preventDefault();
      e.stopPropagation();
      isPanning = true;
      panMoved = false;
      suppressGraphClick = false;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panScrollLeft = timelineScroll.scrollLeft;
      panScrollTop = timelineScroll.scrollTop;
      timelineScroll.classList.add('dragging');
    }
    timelineScroll.addEventListener('pointerdown', beginPan);
    document.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      e.preventDefault();
      const dx = e.clientX - panStartX;
      const dy = e.clientY - panStartY;
      if (Math.abs(dx) + Math.abs(dy) > 4) panMoved = true;
      timelineScroll.scrollLeft = panScrollLeft - dx;
      timelineScroll.scrollTop = panScrollTop - dy;
    });
    document.addEventListener('pointerup', () => {
      if (!isPanning) return;
      suppressGraphClick = panMoved;
      isPanning = false;
      timelineScroll.classList.remove('dragging');
      if (suppressGraphClick) {
        setTimeout(() => { suppressGraphClick = false; }, 0);
      }
    });
    timelineScroll.addEventListener('pointercancel', () => {
      isPanning = false;
      timelineScroll.classList.remove('dragging');
    });

    function updateCurrentParagraph() {
      const paras = [...sourceScroll.querySelectorAll('.source-text p')];
      let closest = null;
      for (const p of paras) {
        const delta = Math.abs(p.getBoundingClientRect().top - sourceScroll.getBoundingClientRect().top - 120);
        if (!closest || delta < closest.delta) closest = { p, delta };
      }
      paras.forEach(p => p.style.background = '');
      if (closest) closest.p.style.background = 'rgba(255,255,255,0.28)';
    }

    function csvAttr(el, name) {
      const value = el.dataset[name] || '';
      return value ? value.split(',').filter(Boolean) : [];
    }

    function applyMarkModes() {
      document.querySelectorAll('mark.source-mark').forEach(m => {
        const hasEntity = m.classList.contains('entity');
        const hasLocation = m.classList.contains('location');
        const hasTime = m.classList.contains('time');
        const visible =
          (activeMarkTypes.has('entity') && hasEntity) ||
          (activeMarkTypes.has('location') && hasLocation) ||
          (activeMarkTypes.has('time') && hasTime);
        m.classList.toggle('hidden-mark', !visible);
      });
    }

    function entityLabel(eid) {
      const ent = ENTITY_BY_ID[eid];
      return ent ? (ent.canonical_name || eid) : eid;
    }

    function locationLabel(lid) {
      const loc = LOCATION_BY_ID[lid];
      return loc ? (loc.canonical_name || lid) : lid;
    }

    function entityPopoverHtml(entity) {
      if (!entity) return '';
      const surfaces = (entity.surfaces || []).join(' · ');
      return `
        <strong>${entity.canonical_name || entity.entity_id}</strong>
        <div class="muted">${entity.entity_id}${entity.kind ? ' · ' + entity.kind : ''}</div>
        ${surfaces ? `<div><b>aliases:</b> ${surfaces}</div>` : ''}
        ${entity.summary ? `<div>${entity.summary}</div>` : ''}
      `;
    }

    function locationPopoverHtml(location) {
      if (!location) return '';
      const surfaces = (location.surfaces || []).join(' · ');
      return `
        <strong>${location.canonical_name || location.location_id}</strong>
        <div class="muted">${location.location_id}${location.kind ? ' · ' + location.kind : ''}</div>
        ${surfaces ? `<div><b>aliases:</b> ${surfaces}</div>` : ''}
        ${location.summary ? `<div>${location.summary}</div>` : ''}
      `;
    }

    function atomCardHtml(atm, rationales) {
      const tags = [];
      (atm.participant_entity_ids || []).forEach(eid => {
        tags.push(`<span class="tag entity-tag">${entityLabel(eid)}</span>`);
      });
      (atm.location_ids || []).forEach(lid => {
        tags.push(`<span class="tag location-tag">${locationLabel(lid)}</span>`);
      });
      if (atm.confidence) {
        tags.push(`<span class="tag conf-tag ${atm.confidence}">${atm.confidence}</span>`);
      }
      if (atm.qc_notes && atm.qc_notes.length > 0) {
        tags.push('<span class="tag" style="color:#9a4a3f">needs review</span>');
      }
      const rat = rationales && rationales.length ? `<div style="font-size:11px;color:#6b6052;margin-top:4px;font-style:italic">${rationales.join(' · ')}</div>` : '';
      return `
        <strong>${atm.summary || atm.atom_id}</strong>
        <div class="muted">${atm.atom_id}</div>
        ${atm.time_refs && atm.time_refs.length ? '<div style="margin-bottom:4px">' + atm.time_refs.map(tr => tr.surface || tr.normalized_hint || '').filter(Boolean).join(' · ') + '</div>' : ''}
        ${tags.length ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">' + tags.join('') + '</div>' : ''}
        ${rat}
      `;
    }

    function showPopover(html, clientX, clientY) {
      if (!html) return;
      popover.innerHTML = html;
      popover.style.display = 'block';
      const pad = 14;
      const x = Math.min(clientX + pad, window.innerWidth - popover.offsetWidth - pad);
      const y = Math.min(clientY + pad, window.innerHeight - popover.offsetHeight - pad);
      popover.style.left = `${Math.max(pad, x)}px`;
      popover.style.top = `${Math.max(pad, y)}px`;
    }

    function hidePopover() {
      popover.style.display = 'none';
    }

    // ── Highlight buttons ──
    document.querySelectorAll('[data-hl]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.hl;
        if (mode === 'clear') {
          activeMarkTypes.clear();
        } else if (activeMarkTypes.has(mode)) {
          activeMarkTypes.delete(mode);
        } else {
          activeMarkTypes.add(mode);
        }
        document.querySelectorAll('[data-hl]').forEach(b => {
          const bMode = b.dataset.hl;
          b.classList.toggle('active', bMode !== 'clear' && activeMarkTypes.has(bMode));
        });
        applyMarkModes();
      });
    });

    // ── Mode switch removed ──

    function clearActiveSource() {
      document.querySelectorAll('.event-dot').forEach(d => d.classList.remove('active-dot'));
      document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.graph-event-node.highlighted').forEach(n => n.classList.remove('highlighted'));
      document.querySelectorAll('mark').forEach(m => m.classList.remove('active-span'));
    }

    function activateAtom(atomId) {
      const atm = ATOM_BY_ID[atomId];
      if (!atm) return;
      clearActiveSource();

      // Activate dot in graph
      document.querySelectorAll(`.event-dot[data-atom="${atomId}"]`).forEach(d => d.classList.add('active-dot'));
      // Activate card in thread view
      document.querySelectorAll(`.event-card[data-atom="${atomId}"]`).forEach(c => c.classList.add('active'));

      // Highlight source evidence
      const atomMarks = [...document.querySelectorAll('mark[data-atoms]')].filter(m => csvAttr(m, 'atoms').includes(atomId));
      atomMarks.forEach(m => m.classList.add('active-span'));
      if (atomMarks[0]) atomMarks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });

      (atm.participant_entity_ids || []).forEach(eid => {
        document.querySelectorAll('mark[data-entities]').forEach(m => {
          if (csvAttr(m, 'entities').includes(eid)) m.classList.add('active-span');
        });
      });
    }

    function atomTimeIds(atm) {
      return (atm.time_refs || [])
        .map(tr => `${tr.segment_id}:${tr.time_expression_id}`)
        .filter(Boolean);
    }

    function scrollGraphAtomIntoView(atomId) {
      const node = document.querySelector(`.graph-event-node[data-atom="${atomId}"]`);
      if (!node || typeof node.getBBox !== 'function') return;
      const box = node.getBBox();
      timelineScroll.scrollTo({
        left: Math.max(0, box.x + box.width / 2 - timelineScroll.clientWidth / 2),
        top: Math.max(0, box.y + box.height / 2 - timelineScroll.clientHeight / 2),
        behavior: 'smooth',
      });
    }

    function activateTimeIds(timeIds) {
      const wanted = new Set(timeIds);
      const matches = ATOMS.filter(atm => atomTimeIds(atm).some(tid => wanted.has(tid)));
      if (!matches.length) return;
      if (currentView !== 'timeline') showTimelineView();
      clearActiveSource();
      matches.forEach(atm => {
        document.querySelectorAll(`.graph-event-node[data-atom="${atm.atom_id}"]`).forEach(n => n.classList.add('highlighted'));
      });
      scrollGraphAtomIntoView(matches[0].atom_id);
    }

    function threadAtomIds(thread) {
      return new Set(thread.atom_ids || []);
    }

    // ── Timeline graph rendering ──

    function computeGraphLayout() {
      if (_graphLayout) return _graphLayout;

      // Build adjacency from all before_atoms across all timelines
      const adj = {};       // atom_id -> [child_atom_id]
      const inDegree = {};  // atom_id -> count
      const allAtomIds = new Set(ATOMS.map(a => a.atom_id));

      // Initialize
      allAtomIds.forEach(aid => { adj[aid] = []; inDegree[aid] = 0; });

      TIMELINES.forEach(tl => {
        tl.ordered_atoms.forEach(oa => {
          const aid = oa.atom_id;
          if (!adj[aid]) { adj[aid] = []; inDegree[aid] = 0; }
          (oa.before_atoms || []).forEach(baid => {
            // aid is before baid → edge from aid to baid
            if (adj[aid]) adj[aid].push(baid);
            inDegree[baid] = (inDegree[baid] || 0) + 1;
          });
        });
      });

      // Topological sort (Kahn's algorithm) with rank = longest path
      const ranks = {};
      const queue = [];
      for (const [aid, deg] of Object.entries(inDegree)) {
        if (deg === 0) {
          ranks[aid] = 0;
          queue.push(aid);
        }
      }

      while (queue.length > 0) {
        const aid = queue.shift();
        for (const child of (adj[aid] || [])) {
          ranks[child] = Math.max(ranks[child] || 0, (ranks[aid] || 0) + 1);
          inDegree[child]--;
          if (inDegree[child] === 0) queue.push(child);
        }
      }

      // Assign default rank to any remaining
      allAtomIds.forEach(aid => {
        if (!(aid in ranks)) ranks[aid] = 0;
      });

      // Per-timeline ordering: within a timeline, atoms without before_atoms
      // get ordered by their position in ordered_atoms. Compute timeline-local order.
      const timelineLocalOrder = {};
      TIMELINES.forEach(tl => {
        const localOrder = {};
        tl.ordered_atoms.forEach((oa, i) => { localOrder[oa.atom_id] = i; });
        timelineLocalOrder[tl.timeline_id] = localOrder;
      });

      // Refine ranks: within each timeline, ensure atoms are ordered by local position
      // when they have the same topological rank
      // Build rank groups, sort each group by earliest timeline position
      const rankGroups = {};
      allAtomIds.forEach(aid => {
        const r = ranks[aid] || 0;
        if (!rankGroups[r]) rankGroups[r] = [];
        rankGroups[r].push(aid);
      });

      // Assign visual rows. Topological ranks preserve coarse order, but every
      // atom in a dense rank gets its own row so dots and labels do not pile up.
      const subRanks = {};
      let visualRow = 0;
      Object.entries(rankGroups).sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([, aids]) => {
        // Sort by first appearance in any timeline
        aids.sort((a, b) => {
          let aFirst = Infinity, bFirst = Infinity;
          TIMELINES.forEach(tl => {
            const lo = timelineLocalOrder[tl.timeline_id];
            if (lo && a in lo && lo[a] < aFirst) aFirst = lo[a];
            if (lo && b in lo && lo[b] < bFirst) bFirst = lo[b];
          });
          return aFirst - bFirst;
        });
        aids.forEach((aid) => {
          subRanks[aid] = visualRow;
          visualRow += 1;
        });
        visualRow += 0.35;
      });

      // Map each atom to which timelines contain it
      const atomTimelines = {};
      const atomRationales = {};
      TIMELINES.forEach(tl => {
        tl.ordered_atoms.forEach(oa => {
          if (!atomTimelines[oa.atom_id]) {
            atomTimelines[oa.atom_id] = [];
            atomRationales[oa.atom_id] = [];
          }
          atomTimelines[oa.atom_id].push(tl.timeline_id);
          if (oa.rationale) atomRationales[oa.atom_id].push(oa.rationale);
        });
      });

      // Collect edges for rendering
      const edges = [];
      const edgeKey = (a, b) => `${a}|||${b}`;
      const addedEdges = new Set();
      TIMELINES.forEach(tl => {
        const tid = tl.timeline_id;
        tl.ordered_atoms.forEach(oa => {
          (oa.before_atoms || []).forEach(baid => {
            const key = edgeKey(oa.atom_id, baid);
            if (!addedEdges.has(key)) {
              addedEdges.add(key);
              edges.push({
                from: oa.atom_id,
                to: baid,
                fromTimeline: tid,
                toTimelines: atomTimelines[baid] || [],
              });
            }
          });
        });
      });

      // Pick a "primary lane" for each atom (first timeline it appears in)
      const primaryLane = {};
      TIMELINES.forEach(tl => {
        tl.ordered_atoms.forEach(oa => {
          if (!(oa.atom_id in primaryLane)) {
            primaryLane[oa.atom_id] = tl.timeline_id;
          }
        });
      });

      _graphLayout = {
        ranks,
        subRanks,
        atomTimelines,
        atomRationales,
        edges,
        primaryLane,
        timelineLocalOrder,
      };
      return _graphLayout;
    }

    function renderTimelineGraph() {
      const layout = computeGraphLayout();
      const { atomRationales } = layout;
      const svg = document.getElementById('timelineGraph');
      const containerWidth = timelineScroll.clientWidth;
      const containerHeight = timelineScroll.clientHeight;
      if (containerWidth <= 0) return;

      const margin = { top: 86, right: 90, left: 76, bottom: 100 };
      const laneSpacing = 190;
      const dotRadius = 7;
      const boxWidth = 142;
      const lineHeight = 15;
      const boxPadX = 8;
      const boxPadY = 7;
      const dotToBox = 12;
      const eventGap = 16;
      const laneX = {};
      const laneBottoms = {};
      const positions = {};

      function wrapSummary(text, maxChars = 10, maxLines = 4) {
        const value = text || '';
        const lines = [];
        for (let i = 0; i < value.length && lines.length < maxLines; i += maxChars) {
          lines.push(value.slice(i, i + maxChars));
        }
        if (value.length > maxChars * maxLines && lines.length) {
          lines[lines.length - 1] = lines[lines.length - 1].slice(0, Math.max(1, maxChars - 1)) + '…';
        }
        return lines.length ? lines : [''];
      }

      TIMELINES.forEach((tl, i) => {
        const x = margin.left + i * laneSpacing;
        laneX[tl.timeline_id] = x;
        let y = margin.top;
        (tl.ordered_atoms || []).forEach(oa => {
          const atm = ATOM_BY_ID[oa.atom_id];
          if (!atm) return;
          const timeText = (atm.time_refs || [])
            .map(tr => tr.surface || tr.normalized_hint || '')
            .filter(Boolean)
            .slice(0, 2)
            .join(' · ');
          const timeLines = timeText ? wrapSummary(timeText, 11, 2) : [];
          const lines = wrapSummary(atm.summary || atm.atom_id);
          const boxHeight = (lines.length + timeLines.length) * lineHeight + boxPadY * 2 + (timeLines.length ? 3 : 0);
          const dotY = y;
          const boxY = dotY + dotToBox;
          positions[`${tl.timeline_id}::${oa.atom_id}`] = {
            x, dotY, boxY, boxHeight, lines, timeLines, atomId: oa.atom_id,
          };
          y = boxY + boxHeight + eventGap;
        });
        laneBottoms[tl.timeline_id] = Math.max(y, margin.top + 80);
      });

      const svgWidth = Math.max(containerWidth * 1.3, margin.left + TIMELINES.length * laneSpacing + margin.right);
      const svgHeight = Math.max(containerHeight * 1.25, Math.max(...Object.values(laneBottoms), margin.top + 200) + margin.bottom);

      svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
      svg.setAttribute('width', svgWidth);
      svg.setAttribute('height', svgHeight);
      svg.style.minWidth = svgWidth + 'px';
      svg.style.minHeight = svgHeight + 'px';
      svg.innerHTML = '';

      const panSurface = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      panSurface.setAttribute('x', '0');
      panSurface.setAttribute('y', '0');
      panSurface.setAttribute('width', svgWidth);
      panSurface.setAttribute('height', svgHeight);
      panSurface.setAttribute('class', 'pan-surface');
      panSurface.addEventListener('pointerdown', beginPan);
      panSurface.addEventListener('click', (e) => {
        if (suppressGraphClick) return;
        document.querySelectorAll('.graph-event-node.selected').forEach(n => n.classList.remove('selected'));
        document.querySelectorAll('.graph-event-node.highlighted').forEach(n => n.classList.remove('highlighted'));
        clearActiveSource();
      });
      svg.appendChild(panSurface);

      const bgGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

      TIMELINES.forEach(tl => {
        const x = laneX[tl.timeline_id];
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        title.setAttribute('x', x);
        title.setAttribute('y', margin.top - 44);
        title.setAttribute('class', 'timeline-title');
        title.setAttribute('data-timeline', tl.timeline_id);
        title.textContent = tl.timeline_id;
        bgGroup.appendChild(title);

        const summary = tl.summary || '';
        if (summary) {
          const desc = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          desc.setAttribute('x', x);
          desc.setAttribute('y', margin.top - 24);
          desc.setAttribute('class', 'timeline-desc');
          desc.setAttribute('data-timeline', tl.timeline_id);
          const maxChars = 20;
          desc.textContent = summary.length > maxChars ? summary.slice(0, maxChars) + '…' : summary;
          bgGroup.appendChild(desc);
        }

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x);
        line.setAttribute('y1', margin.top - 8);
        line.setAttribute('x2', x);
        line.setAttribute('y2', laneBottoms[tl.timeline_id] - eventGap);
        line.setAttribute('class', 'lane-line');
        bgGroup.appendChild(line);

        (tl.ordered_atoms || []).forEach(oa => {
          const from = positions[`${tl.timeline_id}::${oa.atom_id}`];
          if (!from) return;
          (oa.before_atoms || []).forEach(baid => {
            const to = positions[`${tl.timeline_id}::${baid}`];
            if (!to) return;
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${x} ${from.dotY + dotRadius} L ${x} ${to.dotY - dotRadius}`);
            path.setAttribute('class', 'edge-curve same-lane');
            edgeGroup.appendChild(path);
          });
        });

        (tl.ordered_atoms || []).forEach(oa => {
          const atm = ATOM_BY_ID[oa.atom_id];
          const pos = positions[`${tl.timeline_id}::${oa.atom_id}`];
          if (!atm || !pos) return;
          const conf = atm.confidence || 'unknown';
          const node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          node.setAttribute('class', 'graph-event-node');
          node.setAttribute('data-atom', oa.atom_id);
          node.addEventListener('mouseenter', (e) => {
            const rationaleList = atomRationales[oa.atom_id] || [];
            showPopover(atomCardHtml(atm, rationaleList), e.clientX, e.clientY);
          });
          node.addEventListener('mousemove', (e) => {
            if (popover.style.display === 'block') showPopover(popover.innerHTML, e.clientX, e.clientY);
          });
          node.addEventListener('mouseleave', hidePopover);
          node.addEventListener('click', (e) => {
            e.stopPropagation();
            if (suppressGraphClick) return;
            const wasSelected = node.classList.contains('selected');
            // Deselect all event nodes and clear highlights
            document.querySelectorAll('.graph-event-node.selected').forEach(n => n.classList.remove('selected'));
            document.querySelectorAll('.graph-event-node.highlighted').forEach(n => n.classList.remove('highlighted'));
            // Toggle this node
            if (!wasSelected) {
              node.classList.add('selected');
              selectTimeline(tl.timeline_id);
              activateAtom(oa.atom_id);
            } else {
              clearActiveSource();
            }
          });

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', pos.x);
          circle.setAttribute('cy', pos.dotY);
          circle.setAttribute('r', dotRadius);
          circle.setAttribute('class', `event-dot conf-${conf}`);
          circle.setAttribute('data-atom', oa.atom_id);
          circle.setAttribute('stroke', 'var(--graph-dot-stroke)');
          circle.setAttribute('stroke-width', '1.5');
          node.appendChild(circle);

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', pos.x - boxWidth / 2);
          rect.setAttribute('y', pos.boxY);
          rect.setAttribute('width', boxWidth);
          rect.setAttribute('height', pos.boxHeight);
          rect.setAttribute('rx', '10');
          rect.setAttribute('class', 'event-label-box');
          node.appendChild(rect);

          pos.timeLines.forEach((lineText, idx) => {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', pos.x);
            text.setAttribute('y', pos.boxY + boxPadY + lineHeight * (idx + 0.72));
            text.setAttribute('class', 'time-anchor-label');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = lineText;
            node.appendChild(text);
          });

          const summaryStart = pos.timeLines.length ? pos.timeLines.length + 0.28 : 0;
          pos.lines.forEach((lineText, idx) => {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', pos.x);
            text.setAttribute('y', pos.boxY + boxPadY + lineHeight * (summaryStart + idx + 0.78));
            text.setAttribute('class', 'event-summary-label');
            text.textContent = lineText;
            node.appendChild(text);
          });
          nodeGroup.appendChild(node);
        });
      });

      svg.appendChild(bgGroup);
      svg.appendChild(edgeGroup);
      svg.appendChild(nodeGroup);
      _graphLayout = null;
    }

    // ── Thread view rendering ──

    let threadViewMode = 'graph'; // 'graph' | 'cards'

    function buildThreadCards(threadId) {
      const thread = THREAD_BY_ID[threadId];
      if (!thread) return;
      const stack = document.getElementById('threadCardStack');
      const ids = threadAtomIds(thread);

      const threadAtoms = ATOMS
        .filter(a => ids.has(a.atom_id))
        .sort((a, b) => (a.source_order_hint || 0) - (b.source_order_hint || 0));

      const cards = threadAtoms.map(a => {
        const tags = [];
        (a.participant_entity_ids || []).forEach(eid => {
          tags.push(`<span class="tag entity-tag">${entityLabel(eid)}</span>`);
        });
        (a.location_ids || []).forEach(lid => {
          tags.push(`<span class="tag location-tag">${locationLabel(lid)}</span>`);
        });
        if (a.confidence) {
          tags.push(`<span class="tag conf-tag ${a.confidence}">${a.confidence}</span>`);
        }
        if (a.qc_notes && a.qc_notes.length > 0) {
          tags.push('<span class="tag" style="color:#9a4a3f">needs review</span>');
        }
        (a.time_refs || []).forEach(tr => {
          const s = tr.surface || tr.normalized_hint || '';
          if (s) tags.push(`<span class="tag" style="color:var(--muted)">${s}</span>`);
        });

        return `
          <article class="event-card" data-atom="${a.atom_id}">
            <div class="ev-head"><span class="ev-id">${a.atom_id}</span></div>
            <div class="ev-summary">${a.summary || a.atom_id}</div>
            <div class="meta-row">${tags.join('')}</div>
          </article>
        `;
      });

      stack.innerHTML = cards.join('\n');

      stack.querySelectorAll('.event-card').forEach(card => {
        card.addEventListener('click', () => {
          const atomId = card.dataset.atom;
          for (const tl of TIMELINES) {
            if (tl.ordered_atoms.some(oa => oa.atom_id === atomId)) {
              selectTimeline(tl.timeline_id);
              break;
            }
          }
          activateAtom(atomId);
        });
      });
    }

    function activateThread(tid) {
      const thread = THREAD_BY_ID[tid];
      if (!thread) return;

      currentView = 'thread';
      activeThreadId = tid;
      threadViewMode = 'graph';

      // Show thread header
      const header = document.getElementById('threadViewHeader');
      header.style.display = 'flex';
      const atomCount = threadAtomIds(thread).size;
      document.getElementById('threadViewHeaderInfo').innerHTML = `
        <h3>${thread.summary || thread.thread_id}</h3>
        <div class="thread-meta">${thread.thread_id} · ${atomCount} atoms · ${thread.status || 'active'}</div>
      `;

      // Update toggle button
      const toggleBtn = document.getElementById('threadToggleBtn');
      toggleBtn.textContent = 'Cards';
      toggleBtn.classList.remove('active');

      // Highlight thread atoms on graph
      document.querySelectorAll('.graph-event-node.highlighted').forEach(n => n.classList.remove('highlighted'));
      document.querySelectorAll('.graph-event-node.selected').forEach(n => n.classList.remove('selected'));
      clearActiveSource();
      const ids = threadAtomIds(thread);
      ids.forEach(aid => {
        document.querySelectorAll(`.graph-event-node[data-atom="${aid}"]`).forEach(n => n.classList.add('highlighted'));
      });

      // Show graph, hide cards
      document.getElementById('timelineGraph').style.display = 'block';
      document.getElementById('threadCardStack').style.display = 'none';

      // Update nav
      document.querySelectorAll('#timelineNavList .nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('#threadNavList .nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.thread === tid);
      });

      timelineScroll.scrollTop = 0;
    }

    function showTimelineView() {
      currentView = 'timeline';
      activeThreadId = null;
      threadViewMode = 'graph';
      document.getElementById('threadViewHeader').style.display = 'none';
      document.getElementById('threadCardStack').style.display = 'none';
      document.getElementById('timelineGraph').style.display = 'block';
      document.querySelectorAll('.graph-event-node.highlighted').forEach(n => n.classList.remove('highlighted'));
      document.querySelectorAll('#threadNavList .nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('threadToggleBtn').classList.remove('active');
      renderTimelineGraph();
    }

    // ── Thread toggle button ──
    document.getElementById('threadToggleBtn').addEventListener('click', () => {
      const toggleBtn = document.getElementById('threadToggleBtn');
      if (threadViewMode === 'graph') {
        threadViewMode = 'cards';
        toggleBtn.textContent = 'Graph';
        toggleBtn.classList.add('active');
        document.getElementById('timelineGraph').style.display = 'none';
        document.getElementById('threadCardStack').style.display = 'block';
        buildThreadCards(activeThreadId);
      } else {
        threadViewMode = 'graph';
        toggleBtn.textContent = 'Cards';
        toggleBtn.classList.remove('active');
        document.getElementById('threadCardStack').style.display = 'none';
        document.getElementById('timelineGraph').style.display = 'block';
      }
    });

    function selectTimeline(tid) {
      activeTimelineId = tid;
      // Update SVG title/desc selection classes
      document.querySelectorAll('.timeline-title, .timeline-desc').forEach(el => {
        el.classList.toggle('selected', el.dataset.timeline === tid);
      });
      // Update sidebar nav
      document.querySelectorAll('#timelineNavList .nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.timeline === tid);
      });
      document.querySelectorAll('#threadNavList .nav-item').forEach(n => n.classList.remove('active'));
    }

    // ── Source marks hover → popover ──
    document.querySelectorAll('mark.source-mark').forEach(mark => {
      mark.addEventListener('mouseenter', (e) => {
        const entityId = csvAttr(mark, 'entities')[0];
        const locationId = csvAttr(mark, 'locations')[0];
        if (entityId) showPopover(entityPopoverHtml(ENTITY_BY_ID[entityId]), e.clientX, e.clientY);
        else if (locationId) showPopover(locationPopoverHtml(LOCATION_BY_ID[locationId]), e.clientX, e.clientY);
      });
      mark.addEventListener('mousemove', (e) => {
        if (popover.style.display === 'block') showPopover(popover.innerHTML, e.clientX, e.clientY);
      });
      mark.addEventListener('mouseleave', hidePopover);
      mark.addEventListener('click', () => {
        const timeIds = csvAttr(mark, 'times');
        if (timeIds.length) activateTimeIds(timeIds);
      });
    });

    // ── Timeline nav items ──
    document.querySelectorAll('#timelineNavList .nav-item').forEach(item => {
      item.addEventListener('click', () => {
        if (currentView !== 'timeline') showTimelineView();
        document.querySelectorAll('.event-dot').forEach(d => d.classList.remove('dimmed-dot'));
        document.querySelectorAll('.event-card').forEach(c => c.classList.remove('dimmed'));

        const tid = item.dataset.timeline;
        selectTimeline(tid);

        // Scroll SVG to show this timeline's lane
        const margin = { left: 76, right: 90 };
        const laneSpacing = 190;
        const laneX = {};
        TIMELINES.forEach((tl, i) => { laneX[tl.timeline_id] = margin.left + i * laneSpacing; });
        const targetX = laneX[tid];
        if (targetX !== undefined) {
          timelineScroll.scrollLeft = Math.max(0, targetX - timelineScroll.clientWidth / 2);
        }

        _graphLayout = null;
      });
    });

    // ── Thread nav items ──
    document.querySelectorAll('#threadNavList .nav-item').forEach(item => {
      item.addEventListener('click', () => {
        activateThread(item.dataset.thread);
      });
    });

    // ── Init ──
    function init() {
      renderTimelineGraph();
      updateCurrentParagraph();

      // Observe resize to re-render graph
      const ro = new ResizeObserver(() => {
        if (currentView === 'timeline' || (currentView === 'thread' && threadViewMode === 'graph')) {
          _graphLayout = null;
          renderTimelineGraph();
          // Re-apply thread highlights after re-render
          if (currentView === 'thread' && activeThreadId) {
            const ids = threadAtomIds(THREAD_BY_ID[activeThreadId]);
            ids.forEach(aid => {
              document.querySelectorAll(`.graph-event-node[data-atom="${aid}"]`).forEach(n => n.classList.add('highlighted'));
            });
          }
        }
      });
      ro.observe(timelineScroll);
    }

    // Delay init to let layout settle
    requestAnimationFrame(() => {
      requestAnimationFrame(init);
    });

    // ── Chat ──
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');

    const MOCK_RESPONSE = `
      关于芸娘与沈复父母之间的紧张关系，主要线索如下：<br><br>
      <b>1. 代笔书信事件</b><br>
      芸娘为沈复父亲代笔写给沈复的信件，但因措辞不当引起父亲不满。
      相关事件：<span class="ev-cite" data-atom="unit-atom-0016">unit-atom-0016</span>、<span class="ev-cite" data-atom="unit-atom-0017">unit-atom-0017</span><br><br>
      <b>2. 借贷与金钱矛盾</b><br>
      芸娘因娘家经济困难私自借贷，被沈复父母知晓后认为其行为不端。
      相关事件：<span class="ev-cite" data-atom="unit-atom-0020">unit-atom-0020</span><br><br>
      <b>3. 婆媳日常摩擦</b><br>
      芸娘与婆婆在日常家务安排上产生分歧，沈复父亲偏袒母亲，导致芸娘处境艰难。
      相关事件：<span class="ev-cite" data-atom="unit-atom-0024">unit-atom-0024</span>、<span class="ev-cite" data-atom="unit-atom-0030">unit-atom-0030</span><br><br>
      <b>4. 逐出家门</b><br>
      矛盾激化后，沈复父母要求沈复将芸娘送回娘家，芸娘被迫离开沈家。
      相关事件：<span class="ev-cite" data-atom="unit-atom-0033">unit-atom-0033</span><br><br>
      以上线索横跨多个时间线，你可点击事件编号查看详情及原文出处。
    `;

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `chat-message ${role}`;
      div.innerHTML = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      chatPanel.classList.add('has-messages');
      chatPanel.classList.remove('collapsed');
      document.getElementById('chatPanelToggle').textContent = '−';

      // Wire up event citations
      div.querySelectorAll('.ev-cite').forEach(cite => {
        cite.addEventListener('click', () => {
          const atomId = cite.dataset.atom;
          if (currentView === 'thread' && threadViewMode === 'cards') {
            // Switch back to graph to show the atom
            document.getElementById('threadToggleBtn').click();
          }
          if (currentView !== 'timeline' && currentView !== 'thread') {
            showTimelineView();
          }
          // Find atom's timeline and select it
          for (const tl of TIMELINES) {
            if (tl.ordered_atoms.some(oa => oa.atom_id === atomId)) {
              selectTimeline(tl.timeline_id);
              break;
            }
          }
          activateAtom(atomId);
          scrollGraphAtomIntoView(atomId);
        });
      });
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      chatInput.value = '';
      // Simulate brief delay then mock response
      setTimeout(() => { addMessage(MOCK_RESPONSE, 'app'); }, 500);
    }

    chatSendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('chatPanelToggle').addEventListener('click', () => {
      const btn = document.getElementById('chatPanelToggle');
      chatPanel.classList.toggle('collapsed');
      btn.textContent = chatPanel.classList.contains('collapsed') ? '+' : '−';
    });
  </script>
</body>
</html>
